[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-confluence-lab"
version = "0.1.0"
description = "Regime-adaptive multi-indicator TradingView/Python strategy research lab"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "requests>=2.32"]

[tool.setuptools.packages.find]
where = ["src"]
