name: V32 Transition Risk Tournament

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/research_equity_rotation_v32.py"
      - "tests/test_equity_rotation_v32.py"
      - ".github/workflows/equity-research-v32.yml"

permissions:
  contents: read

concurrency:
  group: equity-research-v32-main
  cancel-in-progress: true

jobs:
  research:
    name: V32 Research
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
      ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: V32 regression tests
        run: pytest tests/test_equity_rotation_v32.py -q
      - name: Verify paper-data credentials
        shell: bash
        run: |
          test -n "$ALPACA_PAPER_API_KEY"
          test -n "$ALPACA_PAPER_SECRET_KEY"
      - name: Run V32 transition-risk tournament
        timeout-minutes: 165
        shell: bash
        run: |
          set -o pipefail
          python scripts/research_equity_rotation_v32.py 2>&1 | tee v32_research.log
      - name: Upload V32 research pack and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EquityRotationV32-research-pack
          path: |
            EquityRotationV32_research_pack/
            EquityRotationV32_research_pack.zip
            v32_research.log
          if-no-files-found: warn
          retention-days: 30
