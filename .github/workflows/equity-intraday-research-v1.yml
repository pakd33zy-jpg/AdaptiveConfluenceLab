name: Equity Intraday Research V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/research_equity_intraday_v1.py"
      - "tests/test_equity_intraday_v1.py"
      - ".github/workflows/equity-intraday-research-v1.yml"

permissions:
  contents: read

concurrency:
  group: equity-intraday-research-v1
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
      ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Regression tests
        run: pytest tests/test_equity_intraday_v1.py -q

      - name: Verify paper data credentials
        shell: bash
        run: |
          test -n "$ALPACA_PAPER_API_KEY" || (echo "ALPACA_PAPER_API_KEY is missing" && exit 1)
          test -n "$ALPACA_PAPER_SECRET_KEY" || (echo "ALPACA_PAPER_SECRET_KEY is missing" && exit 1)

      - name: Run compounded intraday research
        run: python scripts/research_equity_intraday_v1.py

      - name: Upload research pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EquityIntradayV1-research-pack
          path: |
            EquityIntradayV1_research_pack/
            EquityIntradayV1_research_pack.zip
          if-no-files-found: warn
          retention-days: 30
